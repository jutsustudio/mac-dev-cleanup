name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          bin=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/mac-dev-cleanup
          lipo -info "$bin"
          mkdir dist
          cp "$bin" dist/mac-dev-cleanup
          tar -C dist -czf "mac-dev-cleanup-${GITHUB_REF_NAME}-macos-universal.tar.gz" mac-dev-cleanup
          shasum -a 256 mac-dev-cleanup-*.tar.gz > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mac-dev-cleanup-*.tar.gz checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
