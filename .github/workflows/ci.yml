name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  test:
    # Intel runners: free arm64 macOS runners for public repos queue for 15+ minutes and time out.
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: swift build
      - run: swift test
